<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IG Content AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06080d;--surface:rgba(255,255,255,.035);--surface-hover:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.08);--border-glow:rgba(45,212,191,.35);
  --text:#eef2f6;--text2:#8b96a5;--text3:#525c6b;
  --cyan:#2dd4bf;--cyan-glow:rgba(45,212,191,.25);
  --blue:#38bdf8;
  --red:#f87171;--red-light:rgba(248,113,113,.1);
  --green:#4ade80;--green-light:rgba(74,222,128,.1);
  --font:'Geist',sans-serif;--mono:'Geist Mono',monospace;
  --r:14px;
}
html,body{height:100%;-webkit-font-smoothing:antialiased}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
  background-image:
    radial-gradient(circle at 15% 0%, rgba(45,212,191,.06), transparent 45%),
    radial-gradient(circle at 85% 20%, rgba(56,189,248,.05), transparent 40%);
  background-attachment:fixed;
}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
/* AUTH */
#auth-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100}
#auth-screen::before{content:'';position:absolute;top:-10%;left:-10%;width:500px;height:500px;background:radial-gradient(circle,var(--cyan-glow),transparent 70%);filter:blur(40px);opacity:.5;pointer-events:none}
.auth-card{width:100%;max-width:380px;padding:32px;background:var(--surface);border:1px solid var(--border);border-radius:20px;backdrop-filter:blur(20px);position:relative;z-index:1;box-shadow:0 40px 100px rgba(0,0,0,.5)}
.logo{display:flex;align-items:center;gap:9px;margin-bottom:24px;justify-content:center}
.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:flex;align-items:center;justify-content:center;font-weight:900;color:#00201c;box-shadow:0 0 24px var(--cyan-glow)}
.logo-name{font-size:18px;font-weight:800;letter-spacing:-.04em}
input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.03);color:var(--text);font-family:var(--font);font-size:13px;outline:none;margin-bottom:12px;transition:.15s}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-glow)}
label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:5px}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#00201c;box-shadow:0 6px 20px var(--cyan-glow)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
/* MAIN */
.hidden{display:none!important}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;backdrop-filter:blur(10px)}
.card+.card{margin-top:14px}
.card.glow{border-color:var(--border-glow);box-shadow:0 0 40px -10px var(--cyan-glow)}
.section-title{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:14px}
.hero{font-size:26px;font-weight:900;letter-spacing:-.05em;margin-bottom:4px}
.sub{color:var(--text2);font-size:13px}
.media-grid{display:flex;flex-direction:column;gap:10px}
.media-row{border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.02);overflow:hidden;transition:.15s}
.media-row:hover{border-color:var(--border-glow)}
.media-row-head{display:flex;align-items:center;gap:14px;padding:12px 14px;cursor:pointer}
.media-thumb{width:52px;height:52px;border-radius:9px;overflow:hidden;flex-shrink:0;background:rgba(255,255,255,.04);position:relative}
.media-thumb img{width:100%;height:100%;object-fit:cover}
.media-row-info{flex:1;min-width:0}
.media-row-caption{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:480px}
.media-row-stats{font-size:11px;color:var(--text3);margin-top:2px}
.media-row-chevron{color:var(--text3);font-size:12px;transition:.2s;flex-shrink:0}
.media-row.open .media-row-chevron{transform:rotate(90deg);color:var(--cyan)}
.media-analysis{max-height:0;overflow:hidden;transition:max-height .25s ease}
.media-analysis-inner{padding:0 14px 16px 14px;border-top:1px solid var(--border)}
.analysis-block{margin-top:12px}
.analysis-label{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--cyan);margin-bottom:5px}
.analysis-text{font-size:12.5px;color:var(--text2);line-height:1.6}
.idea-card{border:1px solid var(--border);border-radius:12px;padding:14px;background:rgba(255,255,255,.02);margin-bottom:10px;position:relative;overflow:hidden}
.idea-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:linear-gradient(var(--cyan),var(--blue))}
.idea-hook{font-weight:700;font-size:13px;margin-bottom:4px}
.idea-meta{font-size:11px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.idea-body{font-size:12px;color:var(--text2);line-height:1.6}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
</style>
</head>
<body>

<!-- ── AUTH ── -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="logo">
      <div class="logo-mark">IG</div>
      <div class="logo-name">Content AI</div>
    </div>
    <label>E-posta</label>
    <input type="email" id="auth-email" placeholder="ornek@email.com">
    <label>Şifre</label>
    <input type="password" id="auth-password" placeholder="••••••••">
    <div id="auth-err" class="hidden" style="color:var(--red);font-size:12px;margin-bottom:12px;background:var(--red-light);border-radius:8px;padding:8px 11px"></div>
    <button class="btn btn-primary" onclick="signIn()" style="margin-bottom:8px">Giriş Yap</button>
    <button class="btn btn-ghost" onclick="signUp()">Kayıt Ol</button>
  </div>
</div>

<!-- ── MAIN APP ── -->
<div class="wrap hidden" id="app">
  <div class="topbar">
    <div class="logo">
      <div class="logo-mark">IG</div>
      <div class="logo-name">Content AI</div>
    </div>
    <button class="btn-ghost btn" style="width:auto;padding:8px 14px" onclick="signOut()">Çıkış</button>
  </div>

  <!-- IG bağlı değilse -->
  <div id="connect-card" class="card glow">
    <div class="hero">Instagram hesabını bağla</div>
    <div class="sub" style="margin-bottom:18px">Business/Creator hesabına bağlı Facebook Page ile giriş yap — reels verilerini analiz edelim.</div>
    <button class="btn btn-primary" style="width:auto;padding:12px 22px" onclick="connectInstagram()">Facebook ile Bağlan →</button>
  </div>

  <!-- Bağlandıktan sonra görünecek panel -->
  <div id="dashboard" class="hidden">
    <div class="card" style="margin-bottom:14px">
      <div class="section-title">Hesap</div>
      <div class="sub" id="ig-account-label">—</div>
      <button class="btn btn-primary" style="width:auto;padding:10px 18px;margin-top:12px" onclick="fetchMedia()">Reels'leri Çek</button>
    </div>

    <div id="loading-row" class="hidden card">
      <div class="spinner"></div> Reels çekiliyor...
    </div>

    <div id="media-section" class="hidden">
      <div class="section-title">Son Reels — bir tanesine tıkla, analiz edelim</div>
      <div class="media-grid" id="media-grid"></div>
    </div>
  </div>
</div>


<script>
// ── Yapılandırma ──
const SUPABASE_URL = "https://dgmidczqrhfifqgeiiuo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnbWlkY3pxcmhmaWZxZ2VpaXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0ODE2MzMsImV4cCI6MjEwMzA1NzYzM30.Gitr86DSYTOg_ptRN4wnBUffbCp3jPvRPRVgA1sSP1o";
const WORKER_URL = "https://dgmidczqrhfifqgeiiuo.supabase.co/functions/v1/igcontent-api";
const FB_APP_ID = "4195978024037335";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;
let igAccount = null; // { ig_user_id, access_token, username }

// ── AUTH ──
async function signIn() {
  const email = document.getElementById('auth-email').value;
  const password = document.getElementById('auth-password').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) return showAuthErr(error.message);
  currentUser = data.user;
  boot();
}
async function signUp() {
  const email = document.getElementById('auth-email').value;
  const password = document.getElementById('auth-password').value;
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) return showAuthErr(error.message);
  currentUser = data.user;
  boot();
}
async function signOut() {
  await sb.auth.signOut();
  location.reload();
}
function showAuthErr(msg) {
  const el = document.getElementById('auth-err');
  el.textContent = msg;
  el.classList.remove('hidden');
}

async function boot() {
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  // TODO: Supabase'den bağlı ig_accounts kaydı var mı kontrol et
  // varsa igAccount'u doldur ve dashboard'u göster
}

// ── INSTAGRAM OAUTH (Facebook Login) ──
window.fbAsyncInit = function() {
  FB.init({ appId: FB_APP_ID, cookie: true, xfbml: false, version: 'v19.0' });
};
(function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(d.getElementById(id))return;js=d.createElement(s);js.id=id;js.src='https://connect.facebook.net/tr_TR/sdk.js';fjs.parentNode.insertBefore(js,fjs);}(document,'script','facebook-jssdk'));

function connectInstagram() {
  FB.login(function(response) {
    if (response.authResponse) {
      const shortToken = response.authResponse.accessToken;
      exchangeAndListAccounts(shortToken);
    }
  }, { scope: 'instagram_basic,pages_read_engagement,pages_show_list,business_management,instagram_manage_insights' });
}

async function exchangeAndListAccounts(shortToken) {
  // 1) uzun ömürlü token'a çevir (worker üzerinden — App Secret frontend'e çıkmaz)
  const exch = await fetch(`${WORKER_URL}/exchange-token`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ short_lived_token: shortToken })
  }).then(r => r.json());
  const longToken = exch.access_token;

  // 2) bağlı IG business hesaplarını listele
  const pages = await fetch(`${WORKER_URL}/ig-accounts`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ access_token: longToken })
  }).then(r => r.json());

  const pageWithIG = (pages.data || []).find(p => p.instagram_business_account);
  if (!pageWithIG) {
    alert("Bağlı bir Instagram Business hesabı bulunamadı. Hesabının Business/Creator olduğundan ve bir Facebook Page'e bağlı olduğundan emin ol.");
    return;
  }

  igAccount = {
    ig_user_id: pageWithIG.instagram_business_account.id,
    access_token: longToken,
    fb_page_id: pageWithIG.id
  };

  // TODO: Supabase ig_accounts tablosuna kaydet (token'ı worker üzerinden şifreleyerek)

  document.getElementById('connect-card').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  document.getElementById('ig-account-label').textContent = `Bağlandı: ${pageWithIG.name}`;
}

// ── REELS ÇEK ──
let mediaList = [];

async function fetchMedia() {
  document.getElementById('loading-row').classList.remove('hidden');
  document.getElementById('media-section').classList.add('hidden');

  const mediaRes = await fetch(`${WORKER_URL}/fetch-media`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ ig_user_id: igAccount.ig_user_id, access_token: igAccount.access_token, limit: 20 })
  }).then(r => r.json());

  mediaList = mediaRes.data || [];
  renderMedia(mediaList);
  document.getElementById('loading-row').classList.add('hidden');
}

function renderMedia(list) {
  const grid = document.getElementById('media-grid');
  grid.innerHTML = list.map((m, i) => {
    const views = (m.insights.find(x => x.name === 'plays') || {}).values?.[0]?.value ?? '—';
    const caption = (m.caption || '(caption yok)').slice(0, 90);
    return `
    <div class="media-row" id="row-${i}">
      <div class="media-row-head" onclick="toggleAnalysis(${i})">
        <div class="media-thumb"><img src="${m.media_url || ''}" onerror="this.style.display='none'"></div>
        <div class="media-row-info">
          <div class="media-row-caption">${caption}</div>
          <div class="media-row-stats">${views} izlenme</div>
        </div>
        <div class="media-row-chevron">▶</div>
      </div>
      <div class="media-analysis" id="analysis-${i}">
        <div class="media-analysis-inner" id="analysis-inner-${i}"></div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('media-section').classList.remove('hidden');
}

// ── TEK VİDEO ANALİZİ (tıklayınca) ──
async function toggleAnalysis(i) {
  const row = document.getElementById(`row-${i}`);
  const panel = document.getElementById(`analysis-${i}`);
  const inner = document.getElementById(`analysis-inner-${i}`);
  const isOpen = row.classList.contains('open');

  if (isOpen) {
    row.classList.remove('open');
    panel.style.maxHeight = '0px';
    return;
  }
  row.classList.add('open');

  if (!inner.dataset.loaded) {
    inner.innerHTML = `<div class="analysis-block"><div class="spinner"></div> Analiz ediliyor...</div>`;
    panel.style.maxHeight = '80px';

    const m = mediaList[i];
    const res = await fetch(`${WORKER_URL}/analyze`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ media_list: [{ caption: m.caption, insights: m.insights }] })
    }).then(r => r.json());

    renderSingleAnalysis(inner, res);
    inner.dataset.loaded = '1';
  }
  panel.style.maxHeight = inner.scrollHeight + 40 + 'px';
}

function renderSingleAnalysis(inner, res) {
  let parsed;
  let rawText = res.content?.[0]?.text || '';
  try {
    let text = rawText.trim().replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/```\s*$/i, '');
    parsed = JSON.parse(text);
  } catch { parsed = null; }

  if (!parsed) {
    inner.innerHTML = `<div class="analysis-block">
      <div class="analysis-label">Ham Yanıt (JSON parse edilemedi)</div>
      <div class="analysis-text" style="white-space:pre-wrap">${(rawText || JSON.stringify(res)).slice(0, 1500)}</div>
    </div>`;
    return;
  }

  const verdict = parsed.performance_verdict || 'Yorum üretilemedi.';
  const hook = parsed.hook_analysis || '—';
  const ideas = parsed.ideas || [];

  inner.innerHTML = `
    <div class="analysis-block">
      <div class="analysis-label">Performans Yorumu</div>
      <div class="analysis-text">${verdict}</div>
    </div>
    <div class="analysis-block">
      <div class="analysis-label">Hook Analizi</div>
      <div class="analysis-text">${hook}</div>
    </div>
    <div class="analysis-block">
      <div class="analysis-label">Buna Benzer 3 Yeni Fikir</div>
      ${ideas.map(idea => `
        <div class="idea-card">
          <div class="idea-hook">${idea.hook || ''}</div>
          <div class="idea-meta">${idea.format || ''} · ${idea.topic || ''}</div>
          <div class="idea-body">${idea.script_outline || ''}</div>
        </div>
      `).join('') || '<div class="analysis-text">Fikir üretilemedi.</div>'}
    </div>
  `;
}

// ── BAŞLANGIÇ ──
sb.auth.getSession().then(({ data }) => {
  if (data.session) { currentUser = data.session.user; boot(); }
});
</script>
</body>
</html>
